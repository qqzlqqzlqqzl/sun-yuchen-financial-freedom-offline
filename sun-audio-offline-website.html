    "transcript": "大家好,我是90后创业者孙宇晨。\n我的新书《这世界既残酷也温柔》已于今年的3月15号在中国大陆地区出版。\n欢迎你到京东图书与我相遇。谢谢。\n大家好,我是宇晨。\n今天又到了我们新的一期节目。\n因为具有相对稳定的环境,足够多的已知数据和流水线的生产模式,\n可以对行业未来的趋势进行准确的预测分析。\n往往这时候我们记得在传统行业的咨询机构经常都会对行业做出一个5年甚至10年的分析。\n而到今天的互联网时代,不确定性成为了整个市场的主要特点。\n在这个时代中,产品具有不确定性,用户具有不确定性。\n趋势具有不确定性。\n那么,与之前长周期的预测理论相比,互联网时代又诞生了怎样一套去适应无确定性的方法呢?\n第一个方法,我们大家众所周知的,就是MVP。\n其实MVP并不是我们打篮球时说的最佳运动员。\n它的全称叫做Minimum Viable Product,就是最小可用产品的一个简称。\n在互联网行业时代,MVP并不是我们打篮球时说的最佳运动员。它的全称叫做Minimum Viable Product,就是最小可用产品的一个简称。\n在互联网行业中,由于外界的环境用户都太不确定了,所以我们往往需要数据和现实本身告诉我们产品的演化方向。\n我记得很清楚,当年张晓龙也说过这么一句话,产品不是被设计出来的,产品是演化出来的。\n从这个角度来讲,其实张晓龙自己都没有办法预测未来两年或者三年微信的真正模样。\n而是根据用户的体验,用户的使用场景,根据大数据而不断演化出来的。\n从这个角度来说,就要求我们在最早期的时候对互联网的产品投入应该是非常谨慎的。\n我们应该制作出一个成本最低,最经济实惠的,最小化,但能被使用的产品,从而根据这个产品得到反馈,得到用户的经验,从而进行演化。\n这与很多传统企业一开始在做互联网的时候非常不适应,有着非常大的关系。\n我在长江商学院有很多来自传统企业的朋友,他们往往对转型互联网时就有很大的不适应。\n举个例子,他们往往会想,好,我们要向互联网转型,那么我要设计一个什么什么样的网站,我要设计一个什么什么什么样的APP。\n而在他产生这个想法的时候,往往是大而全。\n一次性把十年的功能,五年的功能都想得一清二楚,然后要求互联网的产品经理帮他实现。\n这在互联网的时代根本是没有办法办成的。\n互联网的产品一次只能实现一个非常小的功能,然后用小步快跑,快速迭代的方式才能逐渐建立起来。\n我还可以谈一些,因为我自己也是政协委员,时常看到很多政府的项目,\n其实也具有这个显著的特征。\n政府往往做一个民生工程,总是希望一步到位,能够让老百姓一次享受到所有的互联网体验。\n我们可以知道有大量的类似于像民生卡呀,有大量像这种惠民互联网项目。\n政府总是希望一步到位,能让老百姓享受到互联网的权益。\n但是殊不知,互联网从来就没有一步到位过。\n而且甚至在这个角度来说,一开始拍脑袋,\n成立的所谓的民生卡呀,或者是民生互联网项目是否成立,\n也许都要等到产品正式投入到使用中,才能根据用户的反馈做出决定。\n而我们以往工业化的这种工程都是立项审批制,\n也就是第一次如果你还没有立项,这个事就做不了。\n因此我们就会发现非常大的浪费,\n许多民生工程最后审批的经费,要不然就做了一个工程,\n渐渐很快就被互联网,\n技术所淘汰,要不然就无法根据现实环境和用户的变化进行迭代,\n最后也成为了一个废弃的工程。\n而符合互联网世界观的这一套迭代模式,\n却又不在政府的迭代模式之内,\n因此这套方法论呢,也很难被有效的利用。\n这套方法总结起来,\n其实就是MVP,最小可用产品,快速迭代。\n现在我们随处的互联网,\n最初可见的主流互联网产品呢,\n每年都要更新十几到二十个版本,\n平均两周更新一次,\n可以看到互联网产品的迭代速度是多么快。\n就以我自己创办的陪我APP为例,\n我们公司内部产品的迭代速度基本是两周一个新版本,\n也就是说我们使用陪我APP的用户,\n每两周就能使用到更加符合用户体验,\n更加符合用户认知的新产品,\n而我们的迭代速度也许在整个互联网社会中还算慢的呢,\n这与我们通常认识的工程公司的发展模式都是很不一样的。\n试想,我们平常使用的消费品,\n我们时常住的房子,\n这个迭代周期可能都是以年纪,\n十年纪,二十年纪,甚至五十年纪的,\n但是又知道在互联网社会中,\n以前这种非常长的更换周期,迭代周期,\n在互联网社会中,却变成了按年迭代,按月迭代,按周迭代,甚至按日迭代,\n现在我们大家也知道,未来像APP的时代渐渐也会远离我们,\n未来的H5时代基本是所见即所用,所处即所得,\n从这个角度来说,APP甚至连更新都不用了,\n只要有人在客户端更新,直接将新的版本上传到云上,\n用户在使用时就已经是最新版本了,\n所以从这个角度来说,微创新和快速迭代的步伐可能都要以秒计了,\n这就是一个按秒迭代的时代,\n在这个按秒迭代的时代,\n我们谁又敢说自己的所有东西可以一劳永逸,\n永不更改呢?\n这确实是个不确定性的时代,\n就拿我们的大学生活说一说吧,\n我曾经跟朋友分享过,我在大学时加入社团,\n是社团的方式,\n我记得当时在北大我们刚进入社团时,\n很多朋友,\n他就只加入一两个社团,然后从一而终就结束了自己在大学的社团生涯,\n而我宇晨并不是这样做的,\n我往往进入一个大学时候,我会加他我自己最感兴趣的二三十个社团,\n然后用两周时间把每个社团都过一遍,\n然后最后留下一两家我喜欢的社团,\n一直参加社团,\n一直参加社团,\n这也是典型的利用了不确定性原理,\n因为不确定性原理往往都是根据具体的事实数据来进行演化,\n而不是事前规划,\n事前计划出来的,\n很多人在职场时,\n最早期参加非常多的公司,\n去从事非常多的职业,\n经过一两年的摸索期,\n再走入自己一个擅长的行业,\n也是\n典型利用不确定性的一种,\n一种方式。\n用试错学习的方式,\n不断迭代前进,\n可能是这个时代,\n实现财富自由的最好方法了。\n这甚至对传统行业的员工择业,\n也是一个非常大的理念突破。\n好,今天我们对不确定性的讲解\n就到这里,\n谢谢大家。\n请不吝点赞 订阅 转发 打赏支持明镜与点点栏目",

    "transcript": "大家好,我是90后创业者孙宇晨。\n我的新书《这世界既残酷也温柔》已于今年的3月15号在中国大陆地区出版。\n欢迎你到京东图书与我相遇。谢谢。\n大家好,我是宇晨。\n今天又到了我们新的一期节目。\n我们知道有很多现在年纪大的员工,比方说华为就曾经提出70后的员工由于学习新东西的速度太慢,很容易被时代淘汰。\n这一点在客观情况上确实是存在的。\n我以前公司的员工也有一些员工年纪大了,他就希望自己的技术能够一劳永逸,永远不用学习新的技术。\n谁知道在互联网领域,技术更新的速度也是按月按年。\n甚至按日记的,很快很多人他自己学到的看家本领,在短短的几年内就过时了。\n这时候很多员工还希望停留在以前老的技术背景和技术框架下,希望能够一劳永逸。\n但是这是不可能存在的,因此很多员工也渐渐失去了自己在技术中的优势,最后被行业和公司所淘汰。\n那么除了微创新,不断试错,快速迭代,还有什么是在这个不确定性的互联网时代可以被使用的呢?\n我们将这个理论称为正收益系统的不断叠加。\n这是什么意思呢?我们可以给大家举个例子。\n我们大家都知道,质硬币的正反面每次都是不确定性的。\n但是我们也要意识到,只要你质的次数足够多,\n正反面的概率一定是趋向50%的。\n这是不确定性的确定性事件。\n一张100张牌,里面有60张红的,40张黑的,\n每次能抽到哪张牌是不确定性的。\n但是我们也知道,只要我们抽的次数足够多,那一定是抽到红色的牌多。\n这也是确定的。\n因此在任何一个领域,\n如果我们始终待在一个领域,\n我们会把一个大概率为正收益的系统。\n单次结果的收益是正是负,这我们不确定。\n但我们可以确定的是,多次的结果收益一定是正的。\n也就是说,你一定能赢。\n所以在不确定性的时代,我们如果能找到正收益系统,\n并不断将正收益系统叠加,也是一个在不确定性时代很好的生存方式。\n那么对于普通人来说,\n怎样才能找到一个大概率为正收益的系统呢?\n我们举些例子。\n平常我们在节目中经常提到的,\n北上广深、航等一线城市就是一个大概率为正收益的系统。\n举个例子,互联网高科技行业也是一个大概率为正收益的系统。\n所以两个系统的叠加在北上广深行从事高科技行业,\n高科技互联网行业本身就是一个双正收益型。\n所以从这个角度来说,\n即便这个简单的例子也是中国普通人实现自我财富自由,\n实现自我财富增值最好的机会。\n这就是为什么我们时常经常跟别人提起的,\n到一线城市来,到互联网行业来的原因。\n再举个例子,我们在投资中,\n时常给大家推荐,叫做三个叠加,\n行业大周期叠加,\n公司小周期叠加,\n还有创始人自己的小小周期,\n往往也能决定一个公司的发展。\n从投资的角度来说,\n我们就是要在行业的低谷周期,\n公司的低谷周期和创始人的低谷周期叠加时进入,\n在创始人的正周期,\n公司的正周期,\n和行业的正周期这个大周期时抛出这样的投资,\n往往就具有很强的收益确定性。\n这也是负收益系统的叠加和正收益系统的叠加所造成投资收益的重大差别。\n而如果说每一次叠加是两倍的话,\n这样的叠加效率至少是八倍,\n就是二乘二乘二,\n而且有时候甚至是指数型增长,\n要比你平常,\n想象的威力要大得多。\n其实要发现大概率为正收益的系统并不难,\n难的是你在发现这样的收益系统后,\n能不在乎单次的输赢,\n并始终坚持它一定能赢,\n经过大概率的筛选筛选出正收益。\n举个例子,\n很多人好不容易狠心来到了北上广,\n没干几天,\n遇到一些挫折,\n马上就心灰意冷,\n立刻逃跑,\n逃离了北上广。\n这就好像三次如果你制骰子都是反面,\n觉得自己手气不行,\n马上不玩了,\n这样的话你也等不来正面的机会。\n所以从这个角度来说,\n选择收益率为正的系统,\n不断坚持等到大概率正收益的出现也是非常重要的。\n就像我们平常推荐的投资机会,\n在短暂的范围内它确实是有涨有跌,\n但是如何,\n如何能够坚持住享受长线的正收益系统所带来的溢价,\n这就需要我们的不断坚持了。\n这也是巴菲特经常讲的,\n我们在滚雪球时不仅需要滚雪球这个动作本身,\n还要有一个足够长的雪道,\n很有可能在滚雪球的当初由于磕磕碰碰,\n由于这个波动雪球上的雪甚至变得更少了,\n但是如果我们一直坚持下去在一个长雪道进行滚雪球,\n无断的积累最后总能产生正收益。\n比特币也是这样一个典型的例子,\n比特币表面上看起来每日的比特币的价格会大涨大跌,\n但是从长时间周期来看,\n一个去中心化的金融系统的发展是大势所趋,\n这也是为什么在比特币时间如果持币长达\n三到四年的情况下从来没有见过任何一个人因持有比特币而亏损,\n但是在短途追涨杀跌很多人却在比特币世界赔得倾家荡产的重要原因之一,\n这就是确定性和不确定性无断叠加所造成的一个像交响乐一样美妙的事情,\n这就要求你知道交响乐什么时候是高潮什么时候是低潮,\n运用这个高潮与低潮交相辉映的方式最后演奏出一个美丽的交响乐。\n好,今天我们对不确定性的讲解就到这里,\n谢谢大家。",

    const BOILERPLATE_PATTERNS = [
      '请不吝点赞订阅转发打赏支持明镜与点点栏目',
      '欢迎订阅转发打赏支持明镜与点点栏目',
      '请不吝点赞订阅转发打赏支持',
    ];

    function shortFormat(count) {
      return `${count}集`;
    }

    function normalizeText(value) {
      return (value || '')
        .trim()
        .replace(/[\s,，。.!！?？、;；:："“”'‘’\[\]【】()（）]+/g, '');
    }

    function classifyRepeatedUnit(line) {
      const text = (line || '').replace(/\s+/g, '');
      const hits = [];
      if (text.length < 8) return hits;

      for (let size = 1; size <= Math.min(12, Math.floor(text.length / 3)); size += 1) {
        let index = 0;
        while (index <= text.length - size * 3) {
          const unit = text.slice(index, index + size);
          if (!unit || (size > 1 && new Set(unit).size === 1)) {
            index += 1;
            continue;
          }

          let count = 1;
          let cursor = index + size;
          while (text.slice(cursor, cursor + size) === unit) {
            count += 1;
            cursor += size;
          }

          if (count >= 3) {
            hits.push({ unit, count });
            index = cursor;
          } else {
            index += 1;
          }
        }
      }

      return hits.slice(0, 4);
    }

    function isBoilerplate(text) {
      const normalized = normalizeText(text);
      return BOILERPLATE_PATTERNS.some((pattern) => normalized.includes(pattern));
    }

    function analyzeEpisode(item) {
      const lines = (item.transcript || '').split('\n');
      const flaggedLines = new Map();
      const issues = [];
      let last = '';
      let run = [];

      function addFlag(lineNumber, level) {
        const current = flaggedLines.get(lineNumber);
        if (current === 'high' || level === 'high') flaggedLines.set(lineNumber, level);
        else flaggedLines.set(lineNumber, 'medium');
      }

      function closeRun() {
        if (!run.length) return;
        const firstText = lines[run[0] - 1] || '';
        const level = run.length >= 5 || isBoilerplate(firstText) ? 'high' : 'medium';
        issues.push({
          type: isBoilerplate(firstText) ? '固定口播堆叠' : '连续同句',
          level,
          label: `L${run[0]}-L${run[run.length - 1]} x${run.length}`,
          sample: firstText,
        });
        run.forEach((lineNumber) => addFlag(lineNumber, level));
        run = [];
      }

      lines.forEach((line, idx) => {
        const lineNumber = idx + 1;
        const normalized = normalizeText(line);
        if (normalized && normalized === last) {
          if (!run.length) run = [lineNumber - 1, lineNumber];
          else run.push(lineNumber);
        } else {
          closeRun();
        }
        last = normalized;
      });
      closeRun();

      const occurrences = new Map();
      lines.forEach((line, idx) => {
        const normalized = normalizeText(line);
        if (normalized.length >= 12) {
          if (!occurrences.has(normalized)) occurrences.set(normalized, []);
          occurrences.get(normalized).push(idx + 1);
        }
      });

      occurrences.forEach((lineNumbers) => {
        if (lineNumbers.length < 4) return;
        const sample = lines[lineNumbers[0] - 1] || '';
        const alreadyCovered = issues.some((issue) => issue.sample === sample);
        if (alreadyCovered) return;
        const level = lineNumbers.length >= 8 || isBoilerplate(sample) ? 'high' : 'medium';
        issues.push({
          type: isBoilerplate(sample) ? '固定口播重复' : '全文重复句',
          level,
          label: `x${lineNumbers.length}，L${lineNumbers.slice(0, 6).join('/')}`,
          sample,
        });
        lineNumbers.forEach((lineNumber) => addFlag(lineNumber, level));
      });

      lines.forEach((line, idx) => {
        const hits = classifyRepeatedUnit(line);
        if (!hits.length || isBoilerplate(line)) return;
        const hit = hits[0];
        issues.push({
          type: '行内循环',
          level: hit.count >= 5 ? 'medium' : 'low',
          label: `L${idx + 1}，${hit.unit} x${hit.count}`,
          sample: line,
        });
        addFlag(idx + 1, hit.count >= 5 ? 'medium' : 'low');
      });

      const highCount = issues.filter((issue) => issue.level === 'high').length;
      const mediumCount = issues.filter((issue) => issue.level === 'medium').length;
      const lowCount = issues.filter((issue) => issue.level === 'low').length;
      const score = highCount * 20 + mediumCount * 8 + lowCount * 2 + flaggedLines.size;
      const risk = highCount ? 'high' : mediumCount ? 'medium' : lowCount ? 'low' : 'clean';

      return {
        ...item,
        lines,
        issues,
        flaggedLines,
        score,
        risk,
      };
    }

    const analyzedEpisodes = episodes.map(analyzeEpisode);

    function riskLabel(risk) {
      if (risk === 'high') return '高风险';
      if (risk === 'medium') return '中风险';
      if (risk === 'low') return '低风险';
      return '未标记';
    }

    function updateMetrics(list) {
      document.getElementById('metricTotal').textContent = list.length;
      document.getElementById('metricHigh').textContent = list.filter((item) => item.risk === 'high').length;
      document.getElementById('metricMedium').textContent = list.filter((item) => item.risk === 'medium').length;
      document.getElementById('metricClean').textContent = list.filter((item) => item.risk === 'clean').length;
    }

    function splitReadablePieces(line, lineNumber) {
      const text = (line || '').trim();
      if (!text) return [];
      const pieces = [];
      const strong = /[。！？!?；;]/;
      const weak = /[，,、]/;
      let start = 0;
      let lastWeak = -1;

      for (let i = 0; i < text.length; i += 1) {
        const ch = text[i];
        const len = i - start + 1;
        if (weak.test(ch)) lastWeak = i;

        if ((strong.test(ch) && len >= 28) || len >= 120) {
          let end = i + 1;
          if (len >= 120 && lastWeak > start + 36) end = lastWeak + 1;
          pieces.push({ text: text.slice(start, end).trim(), lineNumber });
          start = end;
          lastWeak = -1;
        }
      }

      if (start < text.length) {
        pieces.push({ text: text.slice(start).trim(), lineNumber });
      }
      return pieces.filter((piece) => piece.text);
    }

    function lineRangeLabel(lines) {
      const unique = [...new Set(lines)].sort((a, b) => a - b);
      if (!unique.length) return '';
      const ranges = [];
      let start = unique[0];
      let prev = unique[0];
      for (let i = 1; i <= unique.length; i += 1) {
        const current = unique[i];
        if (current === prev + 1) {
          prev = current;
          continue;
        }
        ranges.push(start === prev ? `${start}` : `${start}-${prev}`);
        start = current;
        prev = current;
      }
      return ranges.join(',');
    }

    function segmentLevel(lines, flaggedLines) {
      let level = '';
      lines.forEach((lineNumber) => {
        const current = flaggedLines.get(lineNumber);
        if (current === 'high') level = 'high';
        else if (current === 'medium' && level !== 'high') level = 'medium';
        else if (current === 'low' && !level) level = 'low';
      });
      return level;
    }

    function buildReadableSegments(item) {
      const pieces = item.lines.flatMap((line, idx) => splitReadablePieces(line, idx + 1));
      const segments = [];
      let current = null;
      const minChars = 48;
      const maxChars = 128;

      function flush() {
        if (!current) return;
        current.text = current.text.trim();
        current.label = lineRangeLabel(current.lines);
        current.level = segmentLevel(current.lines, item.flaggedLines);
        segments.push(current);
        current = null;
      }

      pieces.forEach((piece) => {
        if (!current) {
          current = { text: piece.text, lines: [piece.lineNumber] };
          return;
        }

        const nextText = `${current.text}${piece.text}`;
        const canMerge = nextText.length <= maxChars || current.text.length < minChars;
        if (canMerge) {
          current.text = nextText;
          current.lines.push(piece.lineNumber);
          return;
        }

        flush();
        current = { text: piece.text, lines: [piece.lineNumber] };
      });
      flush();
      return segments;
    }

    function renderTranscript(container, item) {
      container.textContent = '';
      if (!item.lines.length || (item.lines.length === 1 && !item.lines[0])) {
        container.textContent = '暂无转写文本。';
        return;
      }

      buildReadableSegments(item).forEach((segment) => {
        const row = document.createElement('div');
        row.className = `tline${segment.level ? ` flag ${segment.level}` : ''}`;

        const ln = document.createElement('span');
        ln.className = 'ln';
        ln.textContent = segment.label;
        ln.title = `原始行 ${segment.label}`;

        const text = document.createElement('span');
        text.className = 'txt';
        text.textContent = segment.text || ' ';

        row.append(ln, text);
        container.appendChild(row);
      });
    }

    function render(list) {
      const root = document.getElementById('list');
      const tpl = document.getElementById('rowTemplate');
      root.textContent = '';

      for (const item of list) {
        const node = tpl.content.cloneNode(true);
        const article = node.querySelector('.item');
        article.classList.add(item.risk);

        node.querySelector('.title').textContent = `${item.episode}  ${item.title}`;
        node.querySelector('.episode').textContent = item.episode;
        node.querySelector('.duration').textContent = item.duration;
        node.querySelector('.transLen').textContent = item.transcriptLen;

        const sourceLabel = node.querySelector('.sourceLabel');
        sourceLabel.textContent = item.source === 'official-vimeo-m4a-partial' ? '官方 m4a（离线）' : 'Wavlake MP3';
        const sourceBadge = node.querySelector('.source-badge');
        if (item.source === 'official-vimeo-m4a-partial') {
          sourceBadge.classList.add('official');
        }

        const riskBadge = node.querySelector('.risk-badge');
        riskBadge.classList.add(item.risk);
        riskBadge.textContent = `${riskLabel(item.risk)} · ${item.score}`;

        const details = node.querySelector('.preview');
        const transcript = node.querySelector('.transcript');
        details.addEventListener('toggle', () => {
          if (details.open && !transcript.dataset.rendered) {
            renderTranscript(transcript, item);
            transcript.dataset.rendered = '1';
          }
          requestAnimationFrame(updatePageScrollbar);
        });

        node.querySelector('.jump-btn').addEventListener('click', () => {
          details.open = true;
          if (!transcript.dataset.rendered) {
            renderTranscript(transcript, item);
            transcript.dataset.rendered = '1';
          }
          transcript.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });

        const player = node.querySelector('.player');
        player.src = encodeURI(item.audio);
        player.setAttribute('controlsList', 'nodownload');

        root.appendChild(node);
      }

      updateMetrics(list);
      const highCount = list.filter((item) => item.risk === 'high').length;
      const mediumCount = list.filter((item) => item.risk === 'medium').length;
      document.getElementById('resultCount').textContent =
        `共筛选 ${shortFormat(list.length)}；待重转 ${highCount}，待复核 ${mediumCount}。`;
      requestAnimationFrame(updatePageScrollbar);
    }

    const sourceFilter = document.getElementById('sourceFilter');
    const sortMode = document.getElementById('sortMode');
    const qInput = document.getElementById('q');

    function applyFilter() {
      const q = qInput.value.trim().toLowerCase();
      const source = sourceFilter.value;
      const mode = sortMode.value;
      const list = analyzedEpisodes.filter((item) => {
        if (source !== 'all' && item.source !== source) return false;
        const text = `${item.episode} ${item.title} ${item.source} ${item.transcript}`.toLowerCase();
        return text.includes(q);
      });

      list.sort((a, b) => {
        if (mode === 'duration') return b.duration_seconds - a.duration_seconds;
        if (mode === 'transcript') return b.transcriptLen - a.transcriptLen;
        return Number(a.episode) - Number(b.episode);
      });

      render(list);
    }

    qInput.addEventListener('input', applyFilter);
    sourceFilter.addEventListener('change', applyFilter);
    sortMode.addEventListener('change', applyFilter);

    const pageScrollbarThumb = document.getElementById('pageScrollbarThumb');

    function updatePageScrollbar() {
      const doc = document.documentElement;
      const scrollable = doc.scrollHeight - window.innerHeight;
      const trackHeight = window.innerHeight - 24;
      if (scrollable <= 0) {
        pageScrollbarThumb.style.height = `${trackHeight}px`;
        pageScrollbarThumb.style.transform = 'translateY(0)';
        return;
      }
      const thumbHeight = Math.max(42, Math.round((window.innerHeight / doc.scrollHeight) * trackHeight));
      const maxThumbTop = trackHeight - thumbHeight;
      const thumbTop = Math.round((window.scrollY / scrollable) * maxThumbTop);
      pageScrollbarThumb.style.height = `${thumbHeight}px`;
      pageScrollbarThumb.style.transform = `translateY(${thumbTop}px)`;
    }

    window.addEventListener('scroll', updatePageScrollbar, { passive: true });
    window.addEventListener('resize', updatePageScrollbar);

    document.getElementById('totalCount').textContent = shortFormat(episodes.length);
    applyFilter();
    updatePageScrollbar();
  </script>
